[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
surrealdb = { version = "2.6.5", features = ["kv-mem", "kv-rocksdb", "protocol-ws"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
